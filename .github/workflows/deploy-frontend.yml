name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Probar conexión SSH
      run: ssh -i ~/.ssh/id_rsa root@154.12.229.92 "echo 'Conexión exitosa'"
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configurar acceso SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 154.12.229.92 >> ~/.ssh/known_hosts

    - name: Ejecutar script de despliegue del frontend
      run: |
        ssh -i ~/.ssh/id_rsa root@154.12.229.92 'bash ~/deploy-frontend.sh'
